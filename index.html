<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="電略から駅名を検索。カタカナ・半角カナ・ひらがなに対応。">
  <title>電略｜駅名検索</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23151515'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='24' fill='white'%3E電%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="stations.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1>電略<span class="title-divider" aria-hidden="true"> / </span><span class="title-sub">駅名検索</span></h1>
    </header>
    <main class="workspace">
      <section class="input-panel" aria-labelledby="input-label">
        <div class="panel-index" aria-hidden="true">01 <span>INPUT</span></div>
        <div class="input-area">
          <label id="input-label" for="code">電略</label>
          <div class="lookup">
            <div class="input-wrap">
              <input id="code" name="code" type="text" placeholder="例：マン" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="32" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
              <button id="clear" type="button" aria-label="入力を消去" disabled><span aria-hidden="true">×</span></button>
            </div>
            <ul id="suggestions" class="suggestions" role="listbox" aria-label="候補" hidden></ul>
          </div>
        </div>
      </section>
      <section class="result-panel" aria-labelledby="result-heading">
        <div class="result-top"><h2 id="result-heading" class="panel-index">02 <span>STATION</span></h2></div>
        <div id="result" class="result-body" aria-live="polite" aria-atomic="true">
          <p class="empty-mark" aria-label="未入力">—</p>
        </div>
      </section>
    </main>
    <noscript><p class="noscript">JavaScriptを有効にしてください。</p></noscript>
  </div>
</body>
</html>
